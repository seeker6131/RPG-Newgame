<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mourncrown หลังบ้าน</title>
<style>
  /* The back office (director): everything in the game, for the admin accounts only. The server checks every request
     (server/worker.ts /admin/*); this page holds no secret — it uses the game's own sign-in on this device. */
  :root { --bg:#120c12; --card:#1f1620; --line:#4a3a2a; --text:#f3e6c4; --dim:#a89878; --gold:#ffd84a; --red:#ff6a5a; --green:#7ad88a; --blue:#8fc8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #1a1018f2; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header b { color: var(--gold); font-size: 16px; letter-spacing: .5px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button, .btn { background: #2a1d16; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  nav button.on { background: #6a4a10; border-color: var(--gold); }
  .btn.red { background: #5a1a1a; border-color: #8a3a2a; } .btn.green { background: #1f4a2a; border-color: #3a7a4a; }
  main { padding: 14px 16px 40px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .v { font-size: 22px; font-weight: 700; color: var(--gold); } .stat .k { color: var(--dim); font-size: 12px; }
  h2 { font-size: 15px; color: var(--gold); margin: 18px 0 8px; }
  .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 7px 9px; border-bottom: 1px solid #2e2228; text-align: left; white-space: nowrap; font-size: 13px; }
  th { background: #241a1e; color: var(--dim); font-weight: 600; position: sticky; top: 0; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #2a1d22; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: #333; }
  .tag.vip { background: #5a3a8a; } .tag.ban { background: #8a1a1a; } .tag.mute { background: #6a4a10; } .tag.g { background: #1a4a6a; }
  .bar { height: 8px; background: #0b0805; border-radius: 4px; overflow: hidden; margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--green); }
  input[type=number], input[list], #gNote { background: #0f0b12; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
  label { font-size: 13px; color: var(--dim); }
  input[type=search] { background: #0f0b12; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; width: min(320px, 100%); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .dim { color: var(--dim); } .msg { padding: 40px 10px; text-align: center; color: var(--dim); }
  dialog { background: var(--card); color: var(--text); border: 2px solid var(--gold); border-radius: 12px; width: min(760px, 94vw); max-height: 88vh; padding: 0; }
  dialog::backdrop { background: #000a; }
  .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  .db { padding: 12px 14px; overflow: auto; max-height: calc(88vh - 60px); }
  pre { background: #0b0805; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 300px; font-size: 12px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; font-size: 13px; } .kv div:nth-child(odd) { color: var(--dim); }
</style>
</head>
<body>
<header>
  <b>👑 MOURNCROWN หลังบ้าน</b>
  <nav id="tabs"></nav>
  <span class="row" style="margin:0"><input type="search" id="uid" placeholder="🆔 วางรหัสผู้เล่น (UID) เพื่อส่งของ" style="width:min(260px,100%)"><button class="btn green" id="uidGo">🎁 ส่งของ / ดูข้อมูล</button></span>
  <span class="dim" id="upd" style="margin-left:auto;font-size:12px"></span>
</header>
<main id="main"><div class="msg">กำลังโหลด...</div></main>
<dialog id="dlg"><div class="dh"><b id="dt"></b><button class="btn" onclick="dlg.close()">ปิด</button></div><div class="db" id="dbody"></div></dialog>
<script>
const SERVER = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).get('srv') === 'local' ? 'http://127.0.0.1:8787' : 'https://mourncrown.egowenit.workers.dev';   // (?srv=local: a local test copy, this machine only)
let token = ''; try { token = JSON.parse(localStorage.getItem('mc_cloud') || 'null')?.token || ''; } catch {}
const $ = id => document.getElementById(id), main = $('main');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => (Number(v) || 0).toLocaleString('th-TH');
const when = t => { if (!t) return '-'; const d = (Date.now() - t) / 1000; if (d < 60) return 'เมื่อกี้'; if (d < 3600) return Math.floor(d / 60) + ' นาทีที่แล้ว'; if (d < 86400) return Math.floor(d / 3600) + ' ชม.ที่แล้ว'; return new Date(t).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }); };
const CLS = { novice: 'ชาวบ้าน', sword: 'ดาบ', archer: 'ธนู', mage: 'เวท', cleric: 'ผู้พิทักษ์' };
const tags = r => [r.google ? '<span class="tag g">Google</span>' : '<span class="tag">แขก</span>', (r.vip || 0) > Date.now() ? '<span class="tag vip">VIP</span>' : '', r.banned ? '<span class="tag ban">แบน</span>' : '', (r.muted_until || 0) > Date.now() ? '<span class="tag mute">ปิดแชต</span>' : ''].join(' ');
async function api(path, body) {
  const r = await fetch(SERVER + path, { method: body ? 'POST' : 'GET', headers: { 'x-mc-token': token, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 || r.status === 403) throw new Error('admin');
  return r.json();
}
const TABS = [['overview', '📊 ภาพรวม'], ['players', '👥 ผู้เล่น'], ['mail', '📬 จดหมาย'], ['guilds', '🏛 กิลด์'], ['econ', '💰 เศรษฐกิจ'], ['pay', '💳 เติมเงิน'], ['market', '🏪 ตลาด'], ['reports', '🚩 รายงานแชต'], ['flags', '🛡 กันโกง']];
let tab = 'overview', timer = 0, q = '', sort = 'seen', page = 0, showTests = false;
$('tabs').innerHTML = TABS.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('');
$('tabs').onclick = e => { const k = e.target.dataset?.k; if (k) { tab = k; page = 0; show(); } };
const playerRow = r => `<tr class="click" data-id="${esc(r.id)}"><td>${r.test ? '🧪 ' : ''}${esc(r.name || '(ยังไม่ตั้งชื่อ)')}</td><td>${r.lv ?? '-'}</td><td>${esc(CLS[r.cls] || r.cls || '-')}${r.tier ? ' ร่าง ' + (r.tier + 1) : ''}</td><td>${num(r.gold)}</td><td>${num(r.diamonds)}</td><td>${tags(r)}</td><td>${when(r.seen)}</td><td class="dim">${when(r.created)}</td></tr>`;
const playerTable = rows => `<div class="tw"><table><tr><th>ชื่อ</th><th>Lv</th><th>อาชีพ</th><th>ทอง</th><th>💎</th><th>สถานะ</th><th>เข้าล่าสุด</th><th>สมัคร</th></tr>${rows.map(playerRow).join('') || '<tr><td colspan="8" class="dim">ไม่มี</td></tr>'}</table></div>`;
// ---- 💰 the economy (server/worker.ts /admin/econ + the `econ` ledger): what inflates, where gold comes from, who earns ----
let econDays = 7;
const SRC = { kill: 'ฆ่ามอน', roomKill: 'ฆ่ามอน (แมพรวม)', wbKill: 'บอสเร่ร่อน', botKill: 'ฆ่ามอน', pickup: 'เก็บของดรอป', gather: 'เก็บทรัพยากรในป่า', sell: 'ขายของให้ร้าน', sellJunk: 'ขายของขยะให้ร้าน',
  shopBuy: 'ซื้อของร้าน', autoPotion: 'ซื้อยาอัตโนมัติ', vipBuyPotion: 'ซื้อยา (VIP)', upgradeItem: 'ตีบวกอุปกรณ์', dismantle: 'ย่อยอุปกรณ์', craft: 'ตีอุปกรณ์ (โรงตีเหล็ก)', cook: 'ทำอาหาร', brew: 'ปรุงยา',
  build: 'สร้างอาคาร', upgradeBuilding: 'อัปอาคาร', collect: 'เก็บผลผลิตอาคาร', claimTdQuest: 'รางวัลเควส', completeQuest: 'รางวัลเควส', achClaim: 'รางวัลความสำเร็จ', loginClaim: 'รางวัลล็อกอินรายวัน',
  tutorialDone: 'จบบทสอน', dungeonClear: 'ดันเจี้ยน', mailClaim: 'จดหมาย / ของจากแอดมิน', cbtClaim: 'ของขวัญ CBT', marketBuy: 'ซื้อในตลาด (จ่ายผู้เล่น)', marketSold: 'ขายในตลาด (ได้จากผู้เล่น)',
  marketList: 'ลงขายตลาด', marketCancel: 'ยกเลิกขาย', donate: 'บริจาคกิลด์', guildCreate: 'ตั้งกิลด์', guildUpgrade: 'อัปกิลด์', guildShop: 'ร้านกิลด์', houseBuild: 'บ้านในกิลด์', bldRepair: 'ซ่อมอาคารกิลด์',
  houseRepair: 'ซ่อมบ้านกิลด์', hireGuard: 'จ้างทหาร', defBuild: 'ป้อมกิลด์', defUpgrade: 'อัปป้อม', defRepair: 'ซ่อมป้อม', raidEnd: 'ปล้นหมู่บ้าน', warEnd: 'สงครามกิลด์', warDone: 'สงครามกิลด์', seasonClaim: 'รางวัลฤดูกาล',
  mountBuy: 'ซื้อสัตว์ขี่', buyDiamond: 'ซื้อของร้านเพชร', topup: '💳 เติมเงินจริง', vipGift: 'ของขวัญ VIP', supplyTick: 'เสบียงบนแมพ', upSkill: 'อัปสกิล', advanceClass: 'เปลี่ยนร่าง', adminKit: 'ชุดแอดมิน', bountySpawn: 'ค่าหัว',
  sleep: 'นอนพัก', useItem: 'ใช้ไอเทม', stashPut: 'หีบเก็บของ', stashTake: 'หีบเก็บของ', dev: 'ปุ่มทดสอบ (แอดมิน)', wheelSpin: 'กงล้อนำโชค (ทอง)', dwheelSpin: 'กงล้อเพชร', starTrade: 'แลกเหรียญดาว' };
const srcName = k => SRC[k] ? `${SRC[k]} <span class="dim" style="font-size:11px">${esc(k)}</span>` : esc(k);
const sgn = v => { v = Math.round(Number(v) || 0); return v > 0 ? `<span style="color:var(--green)">+${num(v)}</span>` : v < 0 ? `<span style="color:var(--red)">−${num(-v)}</span>` : '<span class="dim">0</span>'; };
function econVerdict(inn, out) {   // gold made vs gold removed (player-to-player market money cancels out)
  if (!inn && !out) return ['⚪', 'ยังไม่มีข้อมูล', 'ระบบเพิ่งเริ่มบันทึก — รอผู้เล่นเล่นสักพัก'];
  if (inn + out < 50000) return ['⚪', 'ข้อมูลยังน้อย', `มีการเคลื่อนไหวของทองแค่ ${num(inn + out)} — รอเก็บข้อมูลสักวันก่อน ค่อยอ่านว่าเฟ้อหรือสมดุล`];
  const r = out ? inn / out : 99;
  if (r > 1.5) return ['🔴', 'เฟ้อ', `ทองถูกสร้างมากกว่าที่ถูกใช้ออก ${r.toFixed(1)} เท่า — ทองสะสมในเกมเร็ว ราคาของจะค่อยๆ แพงขึ้น ควรเพิ่มที่ใช้ทอง หรือลดทองจากแหล่งหลัก`];
  if (r > 1.1) return ['🟡', 'เพิ่มขึ้นช้าๆ', `ทองเข้า ${r.toFixed(2)} เท่าของทองออก — ปกติของเกมช่วงแรก (ผู้เล่นยังเก็บสะสม) จับตาดูต่อ`];
  if (r >= 0.8) return ['🟢', 'สมดุล', `ทองเข้า/ออกใกล้กัน (${r.toFixed(2)} เท่า)`];
  return ['🔵', 'ฝืด', `ทองถูกใช้ออกมากกว่าที่ได้ (${r.toFixed(2)} เท่า) — ผู้เล่นอาจรู้สึกจน ของแพงเกินไป`];
}
function econHtml(d) {
  const tot = k => d.bySrc.reduce((t, r) => t + (Number(r[k]) || 0), 0), sold = Number(d.bySrc.find(r => r.src === 'marketSold')?.g_in) || 0;
  const inn = tot('g_in') - sold, out = tot('g_out') - sold, [ic, word, why] = econVerdict(inn, out);
  const snaps = d.snaps.slice().reverse(), first = snaps.find(x => x.day >= d.since) || snaps[0], last = snaps[snaps.length - 1];
  const per = x => x && x.players ? x.gold / x.players : 0, grow = first && last && first !== last && per(first) ? ((per(last) / per(first) - 1) * 100) : null;
  const resV = (k, name) => { const v = tot(k); return `<div class="stat"><div class="k">${name} สุทธิ ${d.days} วัน</div><div class="v" style="font-size:17px">${sgn(v)}</div><div class="k">${v > 0 ? 'สะสมเพิ่ม (ผลิต > ใช้)' : v < 0 ? 'ถูกใช้มากกว่าผลิต' : '-'} • ทั้งเกมมี ${num(d.now[k])}</div></div>`; };
  const maxIn = Math.max(1, ...d.byDay.map(r => Math.max(Number(r.g_in) || 0, Number(r.g_out) || 0)));
  const medTop = d.top.length ? d.top.map(t => t.g_in).sort((a, b) => a - b)[Math.floor(d.top.length / 2)] : 0;
  return `<div class="row">${[1, 7, 30].map(n => `<button class="btn${econDays === n ? ' green' : ''}" data-days="${n}">${n === 1 ? 'วันนี้' : n + ' วัน'}</button>`).join('')}
      <span class="dim" style="font-size:12px">เริ่มบันทึกที่มาของทองตั้งแต่ 13 พ.ย. 2026 (ก่อนหน้านั้นไม่มีข้อมูล) • ไม่นับบัญชีทดสอบและแอดมิน</span></div>
    <div class="stat" style="margin-bottom:10px"><div class="k">สถานะเศรษฐกิจทอง (${d.days === 1 ? 'วันนี้' : d.days + ' วันล่าสุด'})</div><div class="v">${ic} ${word}</div><div style="font-size:13px">${why}</div>
      <div class="k" style="margin-top:6px">ทองเกิดใหม่ ${num(inn)} • ทองถูกใช้ออก ${num(out)} • ซื้อขายระหว่างผู้เล่น ${num(sold)} (ย้ายมือ ไม่ได้สร้างใหม่)${grow !== null ? ` • ทองเฉลี่ยต่อคน ${grow >= 0 ? '+' : ''}${grow.toFixed(0)}% ตั้งแต่ ${first.day}` : ''}</div></div>
    <div class="grid">
      <div class="stat"><div class="k">ทองทั้งเกมตอนนี้</div><div class="v">💰 ${num(d.now.gold)}</div><div class="k">${num(d.now.players)} คน • เฉลี่ย ${num(Math.round(d.now.gold / Math.max(1, d.now.players)))} • มัธยฐาน ${num(d.now.med)}</div></div>
      <div class="stat"><div class="k">เพชรทั้งเกม</div><div class="v">💎 ${num(d.now.dia)}</div><div class="k">เข้า ${num(tot('d_in'))} • ใช้ ${num(tot('d_out'))} (${d.days} วัน)</div></div>
      ${resV('wood', '🪵 ไม้')}${resV('stone', '🪨 หิน')}${resV('food', '🍖 อาหาร')}
    </div>
    <h2>📊 ทองเข้า / ออก รายวัน</h2>
    <div class="tw"><table><tr><th>วัน</th><th>ทองเข้า</th><th></th><th>ทองออก</th><th>สุทธิ</th><th>คนเล่น</th></tr>${d.byDay.map(r => `<tr><td>${r.day}</td><td>${num(r.g_in)}</td><td style="width:40%"><div class="bar" style="margin:0"><i style="width:${100 * r.g_in / maxIn}%"></i></div><div class="bar" style="margin:2px 0 0"><i style="width:${100 * r.g_out / maxIn}%;background:var(--red)"></i></div></td><td>${num(r.g_out)}</td><td>${sgn(r.g_in - r.g_out)}</td><td>${r.who}</td></tr>`).join('') || '<tr><td colspan="6" class="dim">ยังไม่มีข้อมูล</td></tr>'}</table></div>
    <h2>🔎 ทองมาจากไหน / ไปไหน (${d.days === 1 ? 'วันนี้' : d.days + ' วัน'})</h2>
    <div class="tw"><table><tr><th>แหล่ง</th><th>ทองเข้า</th><th>ทองออก</th><th>💎 เข้า/ออก</th><th>🪵</th><th>🪨</th><th>🍖</th><th>ครั้ง</th><th>คน</th></tr>${d.bySrc.map(r => `<tr><td>${srcName(r.src)}</td><td>${r.g_in ? num(r.g_in) : '-'}</td><td>${r.g_out ? num(r.g_out) : '-'}</td><td>${r.d_in || r.d_out ? `${num(r.d_in)} / ${num(r.d_out)}` : '-'}</td><td>${sgn(r.wood)}</td><td>${sgn(r.stone)}</td><td>${sgn(r.food)}</td><td>${num(r.n)}</td><td>${r.who}</td></tr>`).join('') || '<tr><td colspan="9" class="dim">ยังไม่มีข้อมูล — ข้อมูลเข้าทุก 5 นาทีที่ผู้เล่นเล่นอยู่</td></tr>'}</table></div>
    <h2>🏆 ใครได้ทองมากสุด (${d.days === 1 ? 'วันนี้' : d.days + ' วัน'}) — แตะเพื่อดูที่มาของคนนั้น</h2>
    <div class="tw"><table><tr><th>ชื่อ</th><th>Lv</th><th>ทองเข้า</th><th>ทองออก</th><th>แหล่งหลัก</th><th></th></tr>${d.top.map(t => `<tr class="click" data-id="${esc(t.id)}"><td>${esc(t.name || '(ไม่มีชื่อ)')}</td><td>${t.lv ?? '-'}</td><td>${num(t.g_in)}</td><td>${num(t.g_out)}</td><td>${SRC[t.main] || esc(t.main)}</td><td>${medTop && t.g_in > medTop * 5 && t.g_in > 20000 ? '<span class="tag ban">⚠ สูงผิดปกติ</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="dim">ยังไม่มีข้อมูล</td></tr>'}</table></div>
    <h2>💎 รวยสุดตอนนี้</h2>
    <div class="tw"><table><tr><th>ชื่อ</th><th>ทอง</th><th>เพชร</th></tr>${d.rich.map(r => `<tr class="click" data-id="${esc(r.id)}"><td>${esc(r.name || '(ไม่มีชื่อ)')}</td><td>${num(r.gold)}</td><td>${num(r.dia)}</td></tr>`).join('')}</table></div>

      $('rGo').onclick = async () => { const m = Number($('rMins').value) || 0; if (!confirm('ตั้งมอนบุกหมู่บ้านกลางในอีก ' + m + ' นาที?')) return; await api('/admin/raid', { mins: m }); show(); };

      if ($('aClear')) $('aClear').onclick = async () => { await api('/admin/ann', { text: '', mins: 0 }); show(); };

      $('mAdd').onclick = () => { const v = $('mItem').value, m = v.match(/\[([^\]]+)\]$/), it = (window.ITEMS || []).find(i => i.id === (m ? m[1] : v) || i.name === v); if (!it) { alert('ไม่พบไอเทมนี้ — เลือกจากรายการที่ขึ้นมา'); return; } pick.push({ id: it.id, name: it.name, qty: Math.max(1, Math.min(999, Number($('mQty').value) || 1)) }); $('mItem').value = ''; draw(); };
      $('mSend').onclick = async () => {

        if (!confirm(`ส่งหาผู้เล่น "ทุกคน":\n${b.title}\n${sum.join('\n') || '(จดหมายเปล่า ไม่มีของ)'}\n\nส่งแล้วยกเลิกไม่ได้ — ยืนยัน?`)) return;
        const r = await api('/admin/mailall', b); if (r.ok) { alert('✅ ส่งแล้ว\n' + r.text); show(); } else alert('ส่งไม่สำเร็จ: ' + r.error);
      };
    } else if (tab === 'guilds') {
      const d = await api('/admin/guilds');
      main.innerHTML = `<div class="tw"><table><tr><th>กิลด์</th><th>หัวหน้า</th><th>สมาชิก</th><th>หอกิลด์</th><th>คะแนนสัปดาห์</th><th>โล่</th><th>สร้างเมื่อ</th></tr>${d.rows.map(g => `<tr><td>${esc(g.name)}</td><td>${esc(g.leader_name || '-')}</td><td>${g.members}/10</td><td>Lv${g.hall}</td><td>${num(g.score)}</td><td>${g.shield > Date.now() ? '🛡 อีก ' + Math.ceil((g.shield - Date.now()) / 3600000) + ' ชม.' : '-'}</td><td class="dim">${when(g.at)}</td></tr>`).join('') || '<tr><td colspan="7" class="dim">ยังไม่มีกิลด์</td></tr>'}</table></div>`;
    } else if (tab === 'market') {
      const d = await api('/admin/market'), RAR = ['Common', 'Uncommon', 'Rare', 'Super Rare', 'Legend', 'SL'];
      main.innerHTML = `<div class="tw"><table><tr><th>ของ</th><th>ระดับ</th><th>ราคา</th><th>ผู้ขาย</th><th>สถานะ</th><th>ลงขาย</th></tr>${d.rows.map(m => { let it = {}; try { it = JSON.parse(m.item); } catch {} const st = m.status === 'sold' ? '✅ ขายแล้ว' : m.status === 'open' && m.until > Date.now() ? '🟢 วางขาย' : m.status === 'open' ? '⌛ หมดเวลา' : esc(m.status); return `<tr><td>${esc(it.id)}${it.upg ? ' +' + it.upg : ''}${it.qty > 1 ? ' x' + it.qty : ''}</td><td>${RAR[m.rar] || m.rar}</td><td>💰 ${num(m.price)}</td><td>${esc(m.seller_name)}</td><td>${st}</td><td class="dim">${when(m.at)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="dim">ยังไม่มีของขาย</td></tr>'}</table></div>`;
    } else if (tab === 'reports') {
      const d = await api('/admin/reports');
      main.innerHTML = `<div class="tw"><table><tr><th>เมื่อ</th><th>ผู้ถูกรายงาน</th><th>ข้อความ</th><th>ห้อง</th><th>คนรายงาน</th><th>ปิดแชตอยู่</th></tr>${d.rows.map(r => `<tr class="click" data-id="${esc(r.target)}"><td class="dim">${when(r.at)}</td><td>${esc(r.target_name)}</td><td style="white-space:normal;min-width:200px">${esc(r.text)}</td><td>${esc(r.room)}</td><td>${esc(r.by_name)}</td><td>${(r.muted_until || 0) > Date.now() ? '🔇 ใช่' : '-'}</td></tr>`).join('') || '<tr><td colspan="6" class="dim">ไม่มีรายงาน</td></tr>'}</table></div>`;
    } else if (tab === 'econ') {
      const d = await api('/admin/econ?days=' + econDays);
      main.innerHTML = econHtml(d);
      main.querySelectorAll('button[data-days]').forEach(b => b.onclick = () => { econDays = Number(b.dataset.days); show(); });
    } else if (tab === 'flags') {
      const d = await api('/admin/flags');
      main.innerHTML = `<p class="dim">สิ่งที่ระบบกันโกงจับได้ (ทอง/เลเวลพุ่งผิดปกติ, แก้เพชร/VIP เอง) และสิ่งที่แอดมินทำ</p><div class="tw"><table><tr><th>เมื่อ</th><th>ผู้เล่น</th><th>เรื่อง</th><th>รายละเอียด</th></tr>${d.rows.map(f => `<tr class="click" data-id="${esc(f.id)}"><td class="dim">${when(f.at)}</td><td>${esc(f.name || f.id)}</td><td>${esc(f.what)}</td><td style="white-space:normal">${esc(f.detail)}</td></tr>`).join('') || '<tr><td colspan="4" class="dim">ไม่มี</td></tr>'}</table></div>`;
    }
    $('upd').textContent = 'อัปเดต ' + new Date().toLocaleTimeString('th-TH');
  } catch (e) {
    main.innerHTML = e.message === 'admin' ? '<div class="msg">⛔ บัญชีในเครื่องนี้ไม่ใช่แอดมิน<br>เปิดเกมแล้วล็อกอิน Google ด้วยบัญชีแอดมินก่อน</div>' : `<div class="msg">โหลดไม่สำเร็จ (${esc(e.message)}) — ลองใหม่อีกครั้ง</div>`;
  }
}
main.onclick = e => { const tr = e.target.closest('tr.click'); if (tr) player(tr.dataset.id); };
// the UID box (director): a player copies the ID from their profile and sends it — paste it here to open them (gift form inside)
$('uidGo').onclick = async () => { const id = $('uid').value.trim().replace(/^ID[:\s]*/i, ''); if (!id) { alert('ใส่รหัสผู้เล่นก่อน'); return; } try { const d = await api('/admin/player?id=' + encodeURIComponent(id)); if (!d.acc) { alert('ไม่พบผู้เล่นรหัสนี้ — ตรวจว่าคัดลอกมาครบไหม'); return; } player(id); } catch { alert('เปิดไม่สำเร็จ'); } };
$('uid').onkeydown = e => { if (e.key === 'Enter') $('uidGo').click(); };
async function player(id) {
  const d = await api('/admin/player?id=' + encodeURIComponent(id)), a = d.acc || {}, s = d.save?.data || {};
  $('dt').textContent = (a.name || '(ยังไม่ตั้งชื่อ)') + ' • Lv' + (a.lv ?? '-');
  const inv = (s.inventory || []).map(i => `${i.id}${i.upg ? '+' + i.upg : ''}${i.qty > 1 ? ' x' + i.qty : ''}`).join(', ');
  const muted = (a.muted_until || 0) > Date.now();
  $('dbody').innerHTML = `<div class="row">${tags(a)}</div>
    <div class="kv"><div>รหัสบัญชี</div><div>${esc(a.id)}</div><div>อาชีพ</div><div>${esc(CLS[s.cls] || s.cls)} ร่าง ${(s.tier ?? 0) + 1}</div>
    <div>ทอง</div><div>💰 ${num(s.gold)}</div><div>เพชร</div><div>💎 ${num(s.diamonds)}</div><div>VIP ถึง</div><div>${(s.vipUntil || 0) > Date.now() ? new Date(s.vipUntil).toLocaleString('th-TH') : '-'}</div>
    <div>ไม้ / หิน / อาหาร</div><div>${num(s.res?.wood)} / ${num(s.res?.stone)} / ${num(s.res?.food)}</div><div>กิลด์</div><div>${esc(s.guild?.name || '-')}</div>
    <div>เข้าล่าสุด</div><div>${when(a.seen)}</div><div>สมัคร</div><div>${when(a.created)}</div><div>เซฟล่าสุด</div><div>${when(d.save?.at)} (ครั้งที่ ${d.save?.rev ?? 0})</div></div>
    <h2>⚙ จัดการ</h2><div class="row">
      ${a.banned ? `<button class="btn green" data-a="unban">✅ ปลดแบน</button>` : `<button class="btn red" data-a="ban">⛔ แบน</button>`}
      ${muted ? `<button class="btn green" data-a="unmute">🔊 เปิดแชต</button>` : `<button class="btn" data-a="mute" data-h="24">🔇 ปิดแชต 24 ชม.</button><button class="btn" data-a="mute" data-h="168">🔇 ปิดแชต 7 วัน</button>`}</div>
    <h2>🎁 ส่งของให้ผู้เล่นนี้ (เข้ากล่องจดหมายในเกม)</h2>
    <div class="row"><label>💰 ทอง <input type="number" min="0" id="gGold" style="width:100px"></label><label>🪵 ไม้ <input type="number" min="0" id="gWood" style="width:80px"></label>
      <label>🪨 หิน <input type="number" min="0" id="gStone" style="width:80px"></label><label>🍖 อาหาร <input type="number" min="0" id="gFood" style="width:80px"></label></div>
    <div class="row"><input list="itemList" id="gItem" placeholder="พิมพ์ชื่อไอเทม..." style="width:220px"><datalist id="itemList">${(window.ITEMS || []).map(i => `<option value="${esc(i.name)} [${esc(i.id)}]">`).join('')}</datalist>
      <label>จำนวน <input type="number" min="1" max="999" value="1" id="gQty" style="width:60px"></label><button class="btn" id="gAdd">➕ เพิ่ม</button></div>
    <div id="gList" class="dim" style="font-size:13px;margin-bottom:6px">ยังไม่ได้เลือกไอเทม</div>
    <div class="row"><input id="gNote" placeholder="ข้อความถึงผู้เล่น (ไม่ใส่ก็ได้) เช่น ชดเชยบั๊กอาคารหาย" style="width:min(420px,100%)"><button class="btn green" id="gSend">🎁 ส่งของ</button></div>
    <h2>🎒 กระเป๋า (${(s.inventory || []).length})</h2><div style="font-size:13px">${esc(inv) || '<span class="dim">ว่าง</span>'}</div>
    <h2>🚩 ถูกรายงาน (${d.reports.length})</h2>${d.reports.map(r => `<div style="font-size:13px"><span class="dim">${when(r.at)} • ${esc(r.by_name)}:</span> ${esc(r.text)}</div>`).join('') || '<span class="dim">ไม่มี</span>'}
    <h2>💰 ที่มาของทอง 7 วัน (เริ่มบันทึก 13 พ.ย.)</h2>${(d.econ || []).length ? `<div class="tw"><table style="min-width:420px"><tr><th>แหล่ง</th><th>ทองเข้า</th><th>ทองออก</th><th>💎</th><th>🪵/🪨/🍖</th><th>ครั้ง</th></tr>${d.econ.map(r => `<tr><td>${srcName(r.src)}</td><td>${r.g_in ? num(r.g_in) : '-'}</td><td>${r.g_out ? num(r.g_out) : '-'}</td><td>${r.d_in || r.d_out ? num(r.d_in) + ' / ' + num(r.d_out) : '-'}</td><td>${sgn(r.wood)} / ${sgn(r.stone)} / ${sgn(r.food)}</td><td>${num(r.n)}</td></tr>`).join('')}<tr><td><b>รวม</b></td><td><b>${num(d.econ.reduce((t, r) => t + r.g_in, 0))}</b></td><td><b>${num(d.econ.reduce((t, r) => t + r.g_out, 0))}</b></td><td colspan="3"></td></tr></table></div>` : '<span class="dim">ยังไม่มีข้อมูล</span>'}
    <h2>🛡 กันโกง (${d.flags.length})</h2>${d.flags.map(f => `<div style="font-size:13px"><span class="dim">${when(f.at)}</span> ${esc(f.what)} — ${esc(f.detail)}</div>`).join('') || '<span class="dim">ไม่มี</span>'}
    <h2>🏪 ของที่ลงขาย (${d.market.length})</h2>${d.market.map(m => `<div style="font-size:13px">${esc((() => { try { return JSON.parse(m.item).id; } catch { return '?'; } })())} • 💰 ${num(m.price)} • ${esc(m.status)}</div>`).join('') || '<span class="dim">ไม่มี</span>'}
    <h2>🧾 ข้อมูลตัวละครทั้งหมด</h2><pre>${esc(JSON.stringify(s, null, 1))}</pre>`;
  $('dbody').querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
    const what = b.dataset.a, label = b.textContent.trim();
    if (!confirm(`ยืนยัน "${label}" กับ ${a.name || a.id}?`)) return;
    const r = await api('/admin/act', { id: a.id, what, hours: Number(b.dataset.h) || 24 });
    if (r.ok) { player(id); if (tab !== 'overview') show(); } else alert('ทำไม่สำเร็จ: ' + (r.error || '?'));
  });
  // the gift form: resources + a list of items, sent in one go after a confirmation
  const pick = []; const drawPick = () => { $('gList').textContent = pick.length ? 'จะส่ง: ' + pick.map(p => `${p.name} x${p.qty}`).join(', ') : 'ยังไม่ได้เลือกไอเทม'; };
  $('gAdd').onclick = () => { const v = $('gItem').value, m = v.match(/\[([^\]]+)\]$/), it = (window.ITEMS || []).find(i => i.id === (m ? m[1] : v) || i.name === v); if (!it) { alert('ไม่พบไอเทมนี้ — เลือกจากรายการที่ขึ้นมา'); return; } pick.push({ id: it.id, name: it.name, qty: Math.max(1, Math.min(999, Number($('gQty').value) || 1)) }); $('gItem').value = ''; drawPick(); };
  $('gSend').onclick = async () => {
    const g = { id: a.id, gold: Number($('gGold').value) || 0, wood: Number($('gWood').value) || 0, stone: Number($('gStone').value) || 0, food: Number($('gFood').value) || 0, items: pick.map(p => ({ id: p.id, qty: p.qty })), note: $('gNote').value.trim() };
    const sum = [g.gold && `💰 ${num(g.gold)}`, g.wood && `🪵 ${num(g.wood)}`, g.stone && `🪨 ${num(g.stone)}`, g.food && `🍖 ${num(g.food)}`, ...pick.map(p => `${p.name} x${p.qty}`)].filter(Boolean);
    if (!sum.length) { alert('ยังไม่ได้ใส่ของที่จะส่ง'); return; }
    if (!confirm(`ส่งเข้ากล่องจดหมายของ ${a.name || a.id}:\n${sum.join('\n')}\n\nยืนยัน?`)) return;
    const r = await api('/admin/give', g);
    if (r.ok) { alert('✅ ส่งแล้ว\n' + r.text); player(id); } else alert('ส่งไม่สำเร็จ: ' + (r.error === 'nosave' || r.error === 'target' ? 'ผู้เล่นนี้ยังไม่มีตัวละครบนเซิร์ฟ' : r.error === 'empty' ? 'ไม่มีอะไรส่งได้ (กระเป๋าเต็ม?)' : r.error));
  };
  if (!$('dlg').open) $('dlg').showModal();
}
api('/admin/items').then(d => { window.ITEMS = d.items; }).catch(() => {});
show();
</script>
